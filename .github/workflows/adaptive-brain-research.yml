name: KATARINA Adaptive Research (Historical Only)

# On-demand only: avoid redundant GitHub Actions push/PR fanout.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katarina-adaptive-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository-safe research only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python research runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile read-only selector and replay
        run: |
          python -m compileall -q src/katarina/intelligence/lab/adaptive_walkforward.py
          python -m compileall -q src/katarina/intelligence/lab/adaptive_strategy_library.py
          python -m compileall -q scripts/research/run_adaptive_walkforward.py
      - name: Verify no lookahead, bounded risk and strategy isolation
        run: python -m unittest discover -s tests/unit/intelligence -p 'test_adaptive_walkforward.py' -v
      - name: Historical V6 adaptive diagnostic (17-market scope)
        run: |
          python scripts/research/run_adaptive_walkforward.py \
            --output artifacts/adaptive_walkforward
      - name: Enforce research-only result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path("artifacts/adaptive_walkforward/summary.json").read_text())
          assert summary["orders_sent"]==0
          assert summary["production_action"]=="WAIT"
          assert summary["live_execution_authorized"] is False
          assert summary["cases"]["extra_0.00R"]["event_count"]>0
          assert summary["implementation"]["multiple_strategies_with_matched_outcomes_in_archive"] is False
          print("PAPER_ONLY_RESEARCH_CONTRACT_PASS")
          PY
      - name: GitHub run summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/adaptive_walkforward/SUMMARY.md ]; then
            cat artifacts/adaptive_walkforward/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Adaptive research failed before producing a report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload bounded research results (no broker-private data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: katarina-adaptive-v6-historical-${{ github.run_number }}
          path: artifacts/adaptive_walkforward/
          if-no-files-found: warn
          retention-days: 7
