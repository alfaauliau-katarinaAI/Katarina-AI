name: KATARINA Self-Evolution Lab (GitHub-hosted)

# Research is deliberately manual-only, per tests/static/test_github_action_fanout.py.
# No auto-push fanout, self-hosted runners, VPS actions, broker credentials, or orders.
on:
  workflow_dispatch:
    inputs:
      external_models:
        description: 'Review synthetic research with two external AI models'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  models: read

concurrency:
  group: katarina-self-evolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-research:
    if: github.repository == 'alfaauliau-katarinaAI/Katarina-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      KATARINA_RESEARCH_ONLY: '1'
    steps:
      - name: Checkout source (no retained token)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile self-evolution engine
        run: |
          python -m py_compile src/katarina/intelligence/cognition/self_evolution_lab.py
          python -m py_compile src/katarina/governance/multi_model_evolution_review.py
          python -m py_compile scripts/ai/audit_self_evolution_runner.py

      - name: Verify independently testable learning + reviewer policies
        run: |
          python -m unittest discover -s tests/unit/intelligence -p 'test_self_evolution_lab.py' -v
          python -m unittest discover -s tests/unit/governance -p 'test_multi_model_evolution_review.py' -v
          python -m unittest discover -s tests/unit/intelligence -p 'test_evidence_risk.py' -v

      - name: Execute safe four-scenario research audit
        run: |
          python scripts/ai/audit_self_evolution_runner.py \
            --output build/validation/github-self-evolution.json \
            --summary build/validation/github-self-evolution.md

      - name: Confirm no live trading, external model access, or real alpha claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("build/validation/github-self-evolution.json").read_text())
          assert x["result"] == "PASS_SYNTHETIC_ONLY_NO_LIVE_PROMOTION"
          assert x["evidence_origin"] == "FABRICATED_OFFLINE_SQLITE_FIXTURES_NOT_MARKET_DATA"
          assert x["total_scenarios"] == 4
          assert x["external_ai_models_connected"] is False
          assert x["independent_forward_edge_proven"] is False
          assert x["trading_orders_permitted"] is False
          assert x["self_rewrite_or_merge_permitted"] is False
          assert x["vps_access_or_change"] is False
          assert x["risk_gate"]["research_risk_cap_fraction"] == 0
          assert all(not x["live_execution_authorized"] for x in x["scenarios"])
          print("PASS_ISOLATED_SELF_EVOLUTION_SAFETY_CONTRACT")
          PY

      - name: External model critic OpenAI (GitHub Models)
        if: inputs.external_models
        id: critic_a
        uses: actions/ai-inference@af6ad2c4ac4edf01884054fc3a6caa6d2567c13a # actions/ai-inference@v2.0.8
        with:
          model: openai/gpt-4.1-mini
          max-tokens: 250
          system-prompt: 'Return only JSON. Simulated trading outcomes never authorize live orders or code deployment.'
          prompt: |
            All results here are FABRICATED. We tested 240 fictional signals on
            30 dates. A threshold selected on earlier dates yields 36 later
            simulated holdout observations with a positive modeled mean.
            There are NO real broker fills or independently verified costs.
            Should we investigate this hypothesis further OFFLINE?
            Reply with JSON object fields verdict (APPROVE_RESEARCH, REJECT,
            or ABSTAIN), rationale (short string), and evidence_references
            (list containing cohorts.0.holdout).

      - name: External model critic Meta (GitHub Models)
        if: inputs.external_models
        id: critic_b
        uses: actions/ai-inference@af6ad2c4ac4edf01884054fc3a6caa6d2567c13a # actions/ai-inference@v2.0.8
        with:
          model: meta/Meta-Llama-3.1-8B-Instruct
          max-tokens: 250
          system-prompt: 'Return only JSON. Simulated trading outcomes never authorize live orders or code deployment.'
          prompt: |
            All results here are FABRICATED. We tested 240 fictional signals on
            30 dates. A threshold selected on earlier dates yields 36 later
            simulated holdout observations with a positive modeled mean.
            There are NO real broker fills or independently verified costs.
            Should we investigate this hypothesis further OFFLINE?
            Reply with JSON object fields verdict (APPROVE_RESEARCH, REJECT,
            or ABSTAIN), rationale (short string), and evidence_references
            (list containing cohorts.0.holdout).

      - name: Validate external model verdicts against Katarina evidence gate
        if: inputs.external_models
        env:
          CRITIC_A: ${{ steps.critic_a.outputs.response-file }}
          CRITIC_B: ${{ steps.critic_b.outputs.response-file }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.ai.audit_self_evolution_runner import AS_OF,simulated_history
          from katarina.intelligence.cognition.self_evolution_lab import evaluate_shadow_self_evolution
          from katarina.governance.external_model_bridge import verdict_from_text
          from katarina.governance.multi_model_evolution_review import review_candidate
          db=simulated_history(days=30,strong_net_r=2.,weak_net_r=-1.)
          try:
              report=evaluate_shadow_self_evolution(db,as_of_utc=AS_OF)
          finally:
              db.close()
          assert report['decision']=='RESEARCH_PROPOSAL_ONLY'
          receipt=report['review_receipt_sha256']
          a=verdict_from_text(Path(os.environ['CRITIC_A']).read_text(),model='openai/gpt-4.1-mini',receipt=receipt)
          b=verdict_from_text(Path(os.environ['CRITIC_B']).read_text(),model='meta/Meta-Llama-3.1-8B-Instruct',receipt=receipt)
          decision=review_candidate(report,(a,b))
          assert not decision.real_execution_authorized
          assert not decision.code_mutation_authorized
          result={'status':'TWO_EXTERNAL_AI_MODELS_CONNECTED','gateway':'GITHUB_MODELS',
                  'authors':['openai','meta'],'verdicts':[a.verdict,b.verdict],
                  'research_review':decision.status,'live_authorized':False,
                  'synthetic_only':True,'code_mutation_authorized':False}
          dest=Path('build/validation/github-external-ai-synthetic.json')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(result,indent=2)+'\n')
          print('PASS_REAL_EXTERNAL_MODELS_CONNECTED_SAFELY')
          PY
      - name: GitHub Actions summary
        if: always()
        run: |
          if [ -f build/validation/github-self-evolution.md ]; then
            cat build/validation/github-self-evolution.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Self-evolution lab audit did not complete.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload synthetic-only research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: katarina-self-evolution-${{ github.run_id }}
          path: |
            build/validation/github-self-evolution.json
            build/validation/github-self-evolution.md
            build/validation/github-external-ai-synthetic.json
          if-no-files-found: warn
          retention-days: 7
