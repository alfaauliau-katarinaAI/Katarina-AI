name: KATARINA Autonomous Strategy Discovery (GitHub-hosted)

# Explicit, budget-bounded research. Never starts itself or connects to a VPS.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katarina-strategy-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      KATARINA_RESEARCH_ONLY: "1"
    steps:
      - name: Checkout (no persistent credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile causal evolutionary search
        run: |
          python -m py_compile src/katarina/intelligence/lab/autonomous_strategy_discovery.py
          python -m py_compile scripts/research/run_autonomous_strategy_discovery.py

      - name: Reject hindsight, ambiguous fills and unsafe promotion
        run: |
          python -m unittest discover -s tests/unit/intelligence -p 'test_autonomous_strategy_discovery.py' -v

      - name: Discover synthetic-only rule combinations
        run: |
          python scripts/research/run_autonomous_strategy_discovery.py \
            --synthetic --population 16 --generations 3 --seed 77 \
            --output build/discovery/candidates.json \
            --summary build/discovery/SUMMARY.md

      - name: Enforce standalone research evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/discovery/candidates.json').read_text())
          assert report['data_origin']=='SYNTHETIC_FABRICATED_HOURLY_FIXTURE'
          assert report['engine']=='KATARINA_EVOLUTIONARY_RULE_DISCOVERY_V1'
          assert report['candidate_trials']>0
          assert report['candidate_trials']<=192
          assert report['held_out_was_used_in_selection'] is False
          assert report['broker_fill_prices_verified'] is False
          assert report['live_execution_authorized'] is False
          assert report['model_promotion_permitted'] is False
          assert report['code_rewrite_permitted'] is False
          assert report['orders_sent']==0
          assert report['production_action']=='WAIT'
          assert all(not c['can_authorize_live'] for c in report['candidate_rules'])
          print('PASS_CAUSAL_EVOLUTION_RESEARCH_ONLY')
          PY

      - name: Show GitHub experiment report
        if: always()
        run: |
          if test -f build/discovery/SUMMARY.md; then
            cat build/discovery/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Discovery experiment did not complete." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reproducible discovery diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: katarina-discovery-${{ github.run_id }}
          path: |
            build/discovery/candidates.json
            build/discovery/SUMMARY.md
          if-no-files-found: warn
          retention-days: 7
