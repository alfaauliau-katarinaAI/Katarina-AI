name: Provision encrypted Gemini credential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal-for-owner-vps:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Encrypt key for the owner's VPS without logging or plaintext files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
        run: python scripts/ai/seal_gemini_secret.py --public-key ops/credentials/katarina-gemini-transfer-public.pem --output build/provision/gemini-key.rsa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gemini-vps-encrypted-credential
          path: build/provision/gemini-key.rsa
          if-no-files-found: error
          retention-days: 1
