name: Stage 06-09 Clearance Checks

# Manual native/validation checks only; Body CI owns push and pull-request checks.
# Merged from 4 single-job workflows in cleanup stage 5; job steps are unchanged.
on:
  workflow_dispatch:
    inputs:
      check:
        description: Which check to run
        type: choice
        default: all
        options:
          - all
          - stage06-static
          - modern-compile
          - validation
          - health-safety

permissions:
  contents: read

jobs:
  # from stage06-static.yml
  stage06-static:
    name: Stage 06 Static Evidence
    if: inputs.check == 'all' || inputs.check == 'stage06-static'
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Stage 06 static regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest tests.static.test_stage06_mt5_bridge tests.static.test_stage06_windows_compatibility -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write evidence
        shell: pwsh
        run: |
          $pythonVersion = (python --version 2>&1 | Out-String).Trim()
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "06"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner_os = "$env:RUNNER_OS"
            runner_name = "$env:RUNNER_NAME"
            runner_arch = "$env:RUNNER_ARCH"
            image = "windows-2022"
            python_version = $pythonVersion
            suite = @(
              "tests.static.test_stage06_mt5_bridge",
              "tests.static.test_stage06_windows_compatibility"
            )
            result = "PASS_STAGE06_STATIC_REGRESSIONS"
          }
          New-Item -ItemType Directory -Force -Path "build\mt5" | Out-Null
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -Path "build\mt5\stage06_static_evidence.json" -Encoding UTF8

      - name: Upload static evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage06-static-evidence
          path: build/mt5/stage06_static_evidence.json
          retention-days: 30

  # from stage06-modern-compile.yml
  modern-compile:
    name: Stage 06 Modern MetaEditor Proof
    if: inputs.check == 'all' || inputs.check == 'modern-compile'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage06"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )

          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          Write-Host "Resolved MT5 home: $resolved"
          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Experts" | Out-Null
          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Scripts" | Out-Null
          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Include" | Out-Null

      - name: Strict Stage 06 MetaEditor compile
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\mt5\compile_stage06.ps1" -TerminalDataPath "$env:MT5_HOME" -MetaEditorPath "$env:MT5_HOME\metaeditor64.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Get-Content ".\build\mt5\stage06_compile_evidence.json" -Raw | ConvertFrom-Json
          if ($evidence.result -ne "PASS_COMPILE_PROOF") { throw "Modern compile evidence did not pass." }
          if ($evidence.host.normalized -ne "WINDOWS_SERVER_2022_X64") { throw "Unexpected host: $($evidence.host.normalized)" }

      - name: Run Stage 06 MQL self-test headless
        shell: pwsh
        run: |
          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $evidencePath = Join-Path $commonFiles "Katarina_Stage06_self_test_result.txt"
          Remove-Item $evidencePath -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage06-selftest.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Script=KatarinaStage06SelfTest
          Symbol=EURUSD
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $terminal = Join-Path $env:MT5_HOME "terminal64.exe"
          $p = Start-Process -FilePath $terminal -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Terminal self-test exit code: $($p.ExitCode)"

          if (!(Test-Path $evidencePath)) {
            throw "Stage 06 self-test evidence was not created."
          }

          $values = @{}
          foreach ($line in Get-Content $evidencePath) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $values[$line.Substring(0,$idx)] = $line.Substring($idx+1) }
          }

          if ($values["stage"] -ne "06") { throw "Unexpected self-test stage." }
          if ($values["design_version"] -ne "0.5.0") { throw "Unexpected self-test design version." }
          if ($values["proof_type"] -ne "MQL_SELF_TEST") { throw "Unexpected self-test proof type." }
          if ($values["result"] -ne "PASS") { throw "MQL self-test did not pass." }

          New-Item -ItemType Directory -Force -Path "build\mt5" | Out-Null
          Copy-Item $evidencePath "build\mt5\Katarina_Stage06_self_test_result.txt" -Force

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage 06 final evidence-bound audit
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\mt5\audit_stage06_final.ps1" -PythonExe python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clearance = Get-Content ".\build\mt5\stage06_final_clearance.json" -Raw | ConvertFrom-Json
          if ($clearance.result -ne "PASS_STAGE06_FINAL_CLEARANCE") {
            throw "Stage 06 final clearance did not pass."
          }
          if ([int]$clearance.static_regressions.total -ne 35) {
            throw "Unexpected Stage 06 static regression count."
          }

      - name: Upload Stage 06 final freeze evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage06-final-freeze-evidence
          path: |
            build/mt5/stage06_compile_evidence.json
            build/mt5/*.compile.log
            build/mt5/Katarina_Stage06_self_test_result.txt
            build/mt5/stage06_final_clearance.json
            build/mt5/STAGE_06_FINAL_AUDIT_CANDIDATE.md
          retention-days: 30

  # from stage08-validation.yml
  validation:
    name: Stage 08 Data Validation
    if: inputs.check == 'all' || inputs.check == 'validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Stage 08 validation tests
        shell: bash
        run: |
          export PYTHONPATH=src
          python -m unittest discover -s tests/unit/validation -p 'test_*.py' -v 2>&1 | tee stage08-tests.txt
          grep -E "Ran [0-9]+ tests" stage08-tests.txt
          grep -E "^OK$" stage08-tests.txt

      - name: Run Stage 08 final audit
        shell: bash
        run: |
          export PYTHONPATH=src
          mkdir -p build/stage08
          python scripts/stage08/audit_stage08_final.py --repo-root . --output build/stage08/stage08_final_clearance.json
          python - <<'PY'
          import json
          with open("build/stage08/stage08_final_clearance.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["result"] == "PASS_STAGE08_FINAL_CLEARANCE"
          assert data["ready_for_stage09"] is True
          assert data["live_risk_ready"] is False
          PY

      - name: Upload Stage 08 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage08-final-clearance-evidence
          path: |
            stage08-tests.txt
            build/stage08/stage08_final_clearance.json
          retention-days: 90

  # from stage09-health-safety.yml
  health-safety:
    name: Stage 09 Health Safety
    if: inputs.check == 'all' || inputs.check == 'health-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Stage 09 tests
        shell: bash
        run: |
          export PYTHONPATH=src
          python -m unittest discover -s tests/unit/health -p 'test_*.py' -v 2>&1 | tee stage09-tests.txt
          grep -E "Ran [0-9]+ tests" stage09-tests.txt
          grep -E "^OK$" stage09-tests.txt
      - name: Run Stage 09 final audit
        shell: bash
        run: |
          export PYTHONPATH=src
          mkdir -p build/stage09
          python scripts/stage09/audit_stage09_final.py --repo-root . --output build/stage09/stage09_final_clearance.json
          python - <<'PY'
          import json
          with open("build/stage09/stage09_final_clearance.json", encoding="utf-8") as f:
              data=json.load(f)
          assert data["result"] == "PASS_STAGE09_FINAL_CLEARANCE"
          assert data["ready_for_stage10"] is True
          assert data["live_risk_ready"] is False
          PY
      - name: Upload Stage 09 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage09-final-clearance-evidence
          path: |
            stage09-tests.txt
            build/stage09/stage09_final_clearance.json
          retention-days: 90
