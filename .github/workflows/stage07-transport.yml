name: Stage 07 Transport Checks

# Manual native/validation checks only; Body CI owns push and pull-request checks.
# Merged from 12 single-job workflows in cleanup stage 5; job steps are unchanged.
on:
  workflow_dispatch:
    inputs:
      check:
        description: Which check to run
        type: choice
        default: all
        options:
          - all
          - bridge-integration
          - stage07-communication
          - final-clearance
          - cross-language-handshake
          - mql5-kat1-codec
          - native-account-record
          - native-state-records
          - preclearance
          - reconnect
          - recovery-integration
          - wire-sequence
          - zmq-capability

permissions:
  contents: read

jobs:
  # from stage07-bridge-integration.yml
  bridge-integration:
    name: Stage 07 Bridge Transport Integration
    if: inputs.check == 'all' || inputs.check == 'bridge-integration'
    env:
      MQL5_ZMQ_REPO: coke5151/mql5-zmq
      MQL5_ZMQ_COMMIT: f332ee903fb8f27cbf28a8169824b8130e2aaab2
      KAT_BRIDGE_ENDPOINT: tcp://127.0.0.1:5569
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Katarina
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 transport dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07Bridge"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch pinned MQL5 ZeroMQ binding
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mql5-zmq.zip"
          $extract = "$env:RUNNER_TEMP\mql5-zmq"
          $url = "https://github.com/$env:MQL5_ZMQ_REPO/archive/$env:MQL5_ZMQ_COMMIT.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $root) { throw "Pinned MQL5 ZeroMQ archive extraction failed." }
          "MQL5_ZMQ_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage Katarina and ZeroMQ MQL5 files
        shell: pwsh
        run: |
          $include = "$env:MT5_HOME\MQL5\Include"
          $libraries = "$env:MT5_HOME\MQL5\Libraries"
          $experts = "$env:MT5_HOME\MQL5\Experts"
          $scripts = "$env:MT5_HOME\MQL5\Scripts"

          New-Item -ItemType Directory -Force -Path $include,$libraries,$experts,$scripts | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Zmq" | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Mql\Lang" | Out-Null

          Copy-Item ".\mt5\Include\Katarina" "$include\Katarina" -Recurse -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Zmq\*.mqh" "$include\Zmq\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Mql\Lang\*.mqh" "$include\Mql\Lang\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libzmq.dll" $libraries -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libsodium.dll" $libraries -Force
          Copy-Item ".\mt5\Experts\KatarinaBridgeStage07EA.mq5" "$experts\KatarinaBridgeStage07EA.mq5" -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07BridgeTransportIntegration.mq5" "$scripts\KatarinaStage07BridgeTransportIntegration.mq5" -Force

      - name: Strict compile Stage-07 Bridge EA
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Experts\KatarinaBridgeStage07EA.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Experts\KatarinaBridgeStage07EA.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaBridgeStage07EA.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "Bridge EA compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "Stage-07 Bridge EA compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "Stage-07 Bridge EA EX5 missing." }

          "STAGE07_BRIDGE_EX5_SHA256=$((Get-FileHash $artifact -Algorithm SHA256).Hash)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Strict compile concrete Bridge transport test
        shell: powershell
        run: |
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07BridgeTransportIntegration.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07BridgeTransportIntegration.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07BridgeTransportIntegration.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "Bridge transport compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "Concrete Bridge transport compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "Bridge transport test EX5 missing." }

      - name: Write Python Stage-07 session peer
        shell: pwsh
        run: |
          @'
          import asyncio
          import hashlib
          import json
          import os
          import pathlib
          import sys

          ROOT = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "src"))

          from katarina.adapters.transport.kat1_codec import Kat1Codec, SchemaCatalog
          from katarina.adapters.transport.session import Kat1SessionSupervisor, SessionState
          from katarina.adapters.transport.zmq import ZmqRouterTransport

          def account_id(server: str, login: int) -> str:
              raw = server.encode("utf-8")
              material = (
                  b"KAT1/account-id/v1"
                  + b"\x00"
                  + len(raw).to_bytes(4, "little")
                  + raw
                  + b"\x00"
                  + str(login).encode("ascii")
              )
              return hashlib.sha256(material).digest()[:16].hex()

          async def main():
              endpoint = os.environ["KAT_BRIDGE_ENDPOINT"]
              ready = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-bridge-ready.txt"
              result = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-bridge-python-result.json"

              codec = Kat1Codec(
                  SchemaCatalog.from_path(ROOT / "protocol" / "kat1_message_schemas_v1.json")
              )
              router = ZmqRouterTransport(endpoint=endpoint, send_hwm=64, receive_hwm=64)
              session = Kat1SessionSupervisor(
                  codec=codec,
                  client_instance_id=b"\xA7" * 16,
                  requested_execution_mode=0,
                  heartbeat_interval_ms=1000,
                  stale_after_ms=5000,
              )

              await router.start()
              session.start()
              ready.write_text(endpoint, encoding="utf-8")

              presence = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              hello = session.observe(presence, now_ns=1_000_000_000)
              if hello is None or session.state is not SessionState.HELLO_SENT:
                  raise RuntimeError("Stage-07 Bridge presence did not produce HELLO")
              await router.send_frame(hello.frame, peer=hello.peer)

              ack = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              session.observe(ack, now_ns=1_100_000_000)

              if session.state is not SessionState.RECOVERING:
                  raise RuntimeError(f"Bridge did not end RECOVERING: {session.state}")
              if session.communication_ready or session.live_risk_ready:
                  raise RuntimeError("Bridge handshake illegally granted readiness")

              binding = session.binding
              if binding is None:
                  raise RuntimeError("Bridge HELLO_ACK did not create binding")
              if binding.stream_id != 77 or binding.boot_id != 88:
                  raise RuntimeError("Bridge stream/boot binding mismatch")
              if binding.broker_login != 123456 or binding.broker_server != "Katarina-CI":
                  raise RuntimeError("Bridge broker binding mismatch")

              expected_id = account_id("Katarina-CI", 123456)
              if binding.account_id != expected_id:
                  raise RuntimeError(
                      f"Bridge account_id mismatch expected={expected_id} actual={binding.account_id}"
                  )

              result.write_text(json.dumps({
                  "result": "PASS",
                  "state": session.state.value,
                  "communication_ready": session.communication_ready,
                  "live_risk_ready": session.live_risk_ready,
                  "stream_id": binding.stream_id,
                  "boot_id": binding.boot_id,
                  "account_id": binding.account_id,
                  "broker_login": binding.broker_login,
                  "broker_server": binding.broker_server,
              }, indent=2), encoding="utf-8")
              await router.stop()

          asyncio.run(main())
          '@ | Set-Content -Path "$env:RUNNER_TEMP\kat_bridge_peer.py" -Encoding UTF8

      - name: Run concrete Bridge transport handshake
        shell: pwsh
        run: |
          $ready = "$env:RUNNER_TEMP\kat-bridge-ready.txt"
          $pythonResult = "$env:RUNNER_TEMP\kat-bridge-python-result.json"
          Remove-Item $ready,$pythonResult -Force -ErrorAction SilentlyContinue

          $peer = Start-Process -FilePath "python" -ArgumentList "$env:RUNNER_TEMP\kat_bridge_peer.py" -PassThru -NoNewWindow

          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          while ([DateTime]::UtcNow -lt $deadline -and !(Test-Path $ready)) {
            if ($peer.HasExited) { throw "Python Bridge peer exited before ready." }
            Start-Sleep -Milliseconds 100
          }
          if (!(Test-Path $ready)) { throw "Python Bridge peer did not become ready." }

          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $mt5Evidence = Join-Path $commonFiles "Katarina_Stage07_bridge_transport_result.txt"
          Remove-Item $mt5Evidence -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage07-bridge-transport.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=1
          Enabled=1

          [StartUp]
          Script=KatarinaStage07BridgeTransportIntegration
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $terminal = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Terminal exit code: $($terminal.ExitCode)"

          $peer.WaitForExit(15000) | Out-Null
          if (-not $peer.HasExited) {
            Stop-Process -Id $peer.Id -Force
            throw "Python Bridge peer did not terminate."
          }
          if ($peer.ExitCode -ne 0) { throw "Python Bridge peer failed with exit code $($peer.ExitCode)." }

          if (!(Test-Path $mt5Evidence)) { throw "MT5 Bridge transport evidence missing." }
          if (!(Test-Path $pythonResult)) { throw "Python Bridge evidence missing." }

          $values = @{}
          foreach ($line in Get-Content $mt5Evidence) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $values[$line.Substring(0,$idx)] = $line.Substring($idx+1) }
          }
          $python = Get-Content $pythonResult -Raw | ConvertFrom-Json

          Get-Content $mt5Evidence | Write-Host
          Get-Content $pythonResult | Write-Host

          if ($values["result"] -ne "PASS") { throw "Concrete Bridge transport did not pass." }
          if ($values["communication_ready"] -ne "0") { throw "Bridge transport incorrectly marked communication ready." }
          if ($values["live_risk_ready"] -ne "0") { throw "Bridge transport incorrectly marked live risk ready." }
          if ($python.state -ne "recovering") { throw "Python session is not RECOVERING." }
          if ($python.communication_ready -ne $false -or $python.live_risk_ready -ne $false) {
            throw "Python peer reports illegal readiness."
          }

          Copy-Item $mt5Evidence ".\build\stage07\Katarina_Stage07_bridge_transport_result.txt" -Force
          Copy-Item $pythonResult ".\build\stage07\stage07_bridge_python_result.json" -Force

      - name: Write Bridge integration evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "07"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner = "windows-2022"
            bridge_ea = "KatarinaBridgeStage07EA"
            bridge_ex5_sha256 = "$env:STAGE07_BRIDGE_EX5_SHA256"
            transport = "ZEROMQ_DEALER"
            python_peer = "ZEROMQ_ROUTER"
            account_id_contract = "PASS_CROSS_LANGUAGE_SHA256"
            handshake = "PASS_HEARTBEAT_HELLO_HELLO_ACK"
            final_state = "RECOVERING"
            communication_ready = $false
            live_risk_ready = $false
            stage06_source_modified = $false
            result = "PASS_STAGE07_CONCRETE_BRIDGE_TRANSPORT"
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_bridge_integration_evidence.json" -Encoding UTF8

      - name: Upload Bridge integration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage07-bridge-integration-evidence
          path: |
            build/stage07/KatarinaBridgeStage07EA.compile.log
            build/stage07/KatarinaStage07BridgeTransportIntegration.compile.log
            build/stage07/Katarina_Stage07_bridge_transport_result.txt
            build/stage07/stage07_bridge_python_result.json
            build/stage07/stage07_bridge_integration_evidence.json
          retention-days: 30

  # from stage07-communication.yml
  stage07-communication:
    name: Stage 07 Communication
    if: inputs.check == 'all' || inputs.check == 'stage07-communication'
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 transport dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -c "import zmq, tornado; print('pyzmq=' + zmq.__version__ + ' libzmq=' + zmq.zmq_version() + ' tornado=' + tornado.version)"

      - name: Validate frozen KAT1 vectors
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python scripts/protocol/validate_kat1_vectors.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Stage 07 transport tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest tests.unit.transport.test_stage07_communication tests.unit.transport.test_stage07_stage06_contract -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write Stage 07 evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build\stage07" | Out-Null
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "07"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner_os = "$env:RUNNER_OS"
            runner_arch = "$env:RUNNER_ARCH"
            image = "windows-2022"
            python_version = (python --version 2>&1 | Out-String).Trim()
            kat1_vectors = "PASS"
            transport_tests = "PASS"
            live_risk_enablement = "NOT_OWNED_BY_STAGE_07"
            result = "PASS_STAGE07_PYTHON_COMMUNICATION_BASELINE"
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -Path "build\stage07\stage07_python_communication_evidence.json" -Encoding UTF8

      - name: Upload Stage 07 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage07-python-communication-evidence
          path: build/stage07/stage07_python_communication_evidence.json
          retention-days: 30

  # from stage07-final-clearance.yml
  final-clearance:
    name: Stage 07 Final Clearance
    if: inputs.check == 'all' || inputs.check == 'final-clearance'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 transport dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -m pip install --disable-pip-version-check pywinauto

      - name: Run Stage 07 Python regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest tests.unit.transport.test_stage07_communication tests.unit.transport.test_stage07_stage06_contract -v 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\stage07_python_tests.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = Get-Content "$env:RUNNER_TEMP\stage07_python_tests.txt" -Raw
          if ($text -notmatch "Ran 37 tests" -or $text -notmatch "(?m)^OK\s*$") {
            throw "Expected 37/37 Stage-07 Python tests."
          }

      - name: Download and install MetaTrader 5
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $requested = "C:\MT5Stage07Final"
          $p = Start-Process -FilePath $installer -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }
          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $resolved = Split-Path -Parent $found.FullName }
          }
          if (-not $resolved) { throw "MetaTrader 5 installation not found." }
          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage and compile native TCP proof
        shell: pwsh
        run: |
          $mql = "$env:MT5_HOME\MQL5"
          New-Item -ItemType Directory -Force -Path "$mql\Include\Katarina\Stage07","$mql\Scripts",".\build\stage07" | Out-Null
          Copy-Item ".\mt5\Include\Katarina\*" "$mql\Include\Katarina\" -Recurse -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07TcpFallbackIntegration.mq5" "$mql\Scripts\KatarinaStage07TcpFallbackIntegration.mq5" -Force

          $source = "$mql\Scripts\KatarinaStage07TcpFallbackIntegration.mq5"
          $artifact = "$mql\Scripts\KatarinaStage07TcpFallbackIntegration.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07TcpFallbackIntegration.compile.log"
          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue

          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$mql`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null
          if (!(Test-Path $log)) { throw "Native TCP compile log missing." }
          $text = Get-Content $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") { throw "Native TCP proof compile failed." }
          if (!(Test-Path $artifact)) { throw "Native TCP EX5 missing." }
          "TCP_EX5_SHA256=$((Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure localhost socket allow-list through MT5 UI
        shell: pwsh
        run: |
          python .\scripts\stage07\configure_mt5_network_allowlist.py --terminal "$env:MT5_HOME\terminal64.exe" --output ".\build\stage07\stage07_mt5_allowlist_ui.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ui = Get-Content ".\build\stage07\stage07_mt5_allowlist_ui.json" -Raw | ConvertFrom-Json
          if ($ui.result -ne "PASS_MT5_NETWORK_ALLOWLIST_UI") {
            throw "MT5 localhost allow-list UI automation did not pass."
          }

      - name: Run cross-language native TCP fallback
        shell: pwsh
        run: |
          $ready = "$env:RUNNER_TEMP\kat-tcp-ready.txt"
          $pythonResult = "$env:RUNNER_TEMP\kat-tcp-python-result.json"
          $serverScript = "$env:RUNNER_TEMP\kat_tcp_peer.py"
          Remove-Item $ready,$pythonResult -Force -ErrorAction SilentlyContinue

          @'
          import asyncio
          import json
          import os
          import pathlib
          import sys

          ROOT = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT))
          sys.path.insert(0, str(ROOT / "src"))

          from katarina.adapters.transport.kat1_codec import Kat1Codec, SchemaCatalog
          from katarina.adapters.transport.tcp import Kat1TcpServerTransport

          async def main():
              ready = pathlib.Path(os.environ["KAT_TCP_READY"])
              result = pathlib.Path(os.environ["KAT_TCP_RESULT"])
              codec = Kat1Codec(SchemaCatalog.from_path(ROOT / "protocol" / "kat1_message_schemas_v1.json"))
              transport = Kat1TcpServerTransport(host="127.0.0.1", port=5572, receive_capacity=8)
              await transport.start()
              ready.write_text("READY", encoding="utf-8")
              try:
                  received = await asyncio.wait_for(transport.receive_frame(), timeout=30.0)
                  decoded = codec.decode(received.frame)
                  await transport.send_frame(received.frame, peer=received.peer)
                  result.write_text(json.dumps({
                      "result": "PASS",
                      "message_type": decoded.header.message_type,
                      "sequence": decoded.header.sequence,
                      "stream_id": decoded.header.stream_id,
                      "boot_id": decoded.header.boot_id,
                      "frame_length": len(received.frame),
                      "byte_echo": True,
                  }, indent=2), encoding="utf-8")
              finally:
                  await transport.stop()

          asyncio.run(main())
          '@ | Set-Content -Path $serverScript -Encoding UTF8

          $env:KAT_TCP_READY = $ready
          $env:KAT_TCP_RESULT = $pythonResult
          $peer = Start-Process -FilePath "python" -ArgumentList $serverScript -PassThru -NoNewWindow
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            while ([DateTime]::UtcNow -lt $deadline -and !(Test-Path $ready)) {
              if ($peer.HasExited) { throw "Python TCP peer exited before ready." }
              Start-Sleep -Milliseconds 100
            }
            if (!(Test-Path $ready)) { throw "Python TCP peer did not become ready." }

            $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
            New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
            $mt5Evidence = Join-Path $commonFiles "Katarina_Stage07_tcp_fallback_result.txt"
            Remove-Item $mt5Evidence -Force -ErrorAction SilentlyContinue

            $config = "$env:RUNNER_TEMP\stage07-tcp-final.ini"
            # Do not provide an [Experts] section here. The preceding UI step
            # persisted the terminal's trusted-address settings. Supplying partial
            # Expert settings in a startup config can shadow/reset that persisted
            # state on a fresh terminal process.
            @(
              "[StartUp]",
              "Script=KatarinaStage07TcpFallbackIntegration",
              "Symbol=",
              "Period=H1",
              "ShutdownTerminal=1"
            ) | Set-Content -Path $config -Encoding ASCII

            $terminal = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
            Write-Host "Terminal exit code: $($terminal.ExitCode)"

            # Read the MQL result first. If SocketConnect was blocked, the
            # script exits quickly while the Python peer is still waiting.
            if (!(Test-Path $mt5Evidence)) {
              Write-Host "MT5 evidence path missing: $mt5Evidence"
              $terminalLogs = Get-ChildItem -Path "$env:MT5_HOME\logs" -Filter "*.log" -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 2
              foreach ($log in $terminalLogs) {
                Write-Host "--- terminal log $($log.FullName) ---"
                Get-Content $log.FullName -Tail 120 -ErrorAction SilentlyContinue | Write-Host
              }
              throw "MT5 TCP evidence missing."
            }

            $mt5Text = Get-Content $mt5Evidence -Raw
            Write-Host "--- MT5 native TCP evidence ---"
            Write-Host $mt5Text
            if ($mt5Text -notmatch "result=PASS") {
              throw "Native TCP proof failed: $mt5Text"
            }

            [void]$peer.WaitForExit(10000)
            if (-not $peer.HasExited) { throw "Python TCP peer did not finish after MQL reported PASS." }
            if ($peer.ExitCode -ne 0) { throw "Python TCP peer failed: $($peer.ExitCode)" }
            if (!(Test-Path $pythonResult)) { throw "Python TCP result missing." }

            $py = Get-Content $pythonResult -Raw | ConvertFrom-Json
            if ($py.result -ne "PASS" -or $py.byte_echo -ne $true -or $py.message_type -ne 1 -or $py.frame_length -ne 108) {
              throw "Python TCP byte-equality evidence failed."
            }

            Copy-Item $mt5Evidence ".\build\stage07\Katarina_Stage07_tcp_fallback_result.txt" -Force
            Copy-Item $pythonResult ".\build\stage07\stage07_native_tcp_python_result.json" -Force

            $evidence = [ordered]@{
              schema_version = 1
              stage = "07"
              proof_type = "KATARINA_STAGE07_NATIVE_TCP_FALLBACK"
              runner = "windows-2022"
              endpoint = "tcp://127.0.0.1:5572"
              mql_transport = "SocketCreate/SocketConnect/SocketSend/SocketRead"
              python_transport = "Kat1TcpServerTransport"
              framing = "KAT1_FRAME_LENGTH_ONLY"
              secondary_envelope = $false
              golden_message = "HELLO"
              frame_length = 108
              cross_language_byte_equality = "PASS"
              compile = "PASS_0_ERRORS_0_WARNINGS"
              ex5_sha256 = "$env:TCP_EX5_SHA256"
              live_trading_allowed = $false
              dll_import_allowed = $false
              result = "PASS_STAGE07_NATIVE_TCP_FALLBACK"
            }
            $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_native_tcp_fallback_evidence.json" -Encoding UTF8
          }
          finally {
            if (-not $peer.HasExited) { Stop-Process -Id $peer.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Run backpressure and latency profile
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python .\scripts\stage07\profile_stage07_transport.py --repo-root . --output .\build\stage07\stage07_transport_profile.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Get-Content ".\build\stage07\stage07_transport_profile.json" -Raw | ConvertFrom-Json
          if ($p.result -ne "PASS_STAGE07_BACKPRESSURE_LATENCY_PROFILE") {
            throw "Stage-07 profile did not pass."
          }

      - name: Run final evidence audit
        shell: pwsh
        run: |
          $tcpEvidence = Get-Content ".\build\stage07\stage07_native_tcp_fallback_evidence.json" -Raw
          $synthetic = [ordered]@{
            schema_version = 1
            receipt = [ordered]@{ exit_code = 0 }
            files = @(
              [ordered]@{
                name = "stage07_native_tcp_fallback_evidence.json"
                content_included = $true
                content = $tcpEvidence
              }
            )
          }
          $synthetic | ConvertTo-Json -Depth 12 | Set-Content ".\build\stage07\stage07_tcp_bundle.json" -Encoding UTF8

          python .\scripts\stage07\audit_stage07_final.py --repo-root . --profile-evidence .\build\stage07\stage07_transport_profile.json --tcp-bundle .\build\stage07\stage07_tcp_bundle.json --batch-bundle .\ops\vps\results\katarina-vps-2012r2-01\s7-batch-opt1\bundle.json --output .\build\stage07\stage07_final_clearance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = Get-Content ".\build\stage07\stage07_final_clearance.json" -Raw | ConvertFrom-Json
          if ($audit.result -ne "PASS_STAGE07_FINAL_CLEARANCE" -or $audit.ready_for_stage08 -ne $true) {
            throw "Stage-07 final clearance failed."
          }

      - name: Upload Stage 07 final evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage07-final-clearance-evidence
          path: |
            build/stage07/KatarinaStage07TcpFallbackIntegration.compile.log
            build/stage07/stage07_mt5_allowlist_ui.json
            build/stage07/Katarina_Stage07_tcp_fallback_result.txt
            build/stage07/stage07_native_tcp_python_result.json
            build/stage07/stage07_native_tcp_fallback_evidence.json
            build/stage07/stage07_transport_profile.json
            build/stage07/stage07_final_clearance.json
          retention-days: 90
          if-no-files-found: warn

  # from stage07-handshake.yml
  cross-language-handshake:
    name: Stage 07 Cross-Language Handshake
    if: inputs.check == 'all' || inputs.check == 'cross-language-handshake'
    env:
      MQL5_ZMQ_REPO: coke5151/mql5-zmq
      MQL5_ZMQ_COMMIT: f332ee903fb8f27cbf28a8169824b8130e2aaab2
      KAT_HANDSHAKE_ENDPOINT: tcp://127.0.0.1:5568
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Katarina
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 transport dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt
          python -c "import zmq, tornado; print('pyzmq=' + zmq.__version__ + ' libzmq=' + zmq.zmq_version() + ' tornado=' + tornado.version)"

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07Handshake"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch pinned MQL5 ZeroMQ binding
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mql5-zmq.zip"
          $extract = "$env:RUNNER_TEMP\mql5-zmq"
          $url = "https://github.com/$env:MQL5_ZMQ_REPO/archive/$env:MQL5_ZMQ_COMMIT.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $root) { throw "Pinned MQL5 ZeroMQ archive extraction failed." }
          "MQL5_ZMQ_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage binding and handshake script
        shell: pwsh
        run: |
          $include = "$env:MT5_HOME\MQL5\Include"
          $libraries = "$env:MT5_HOME\MQL5\Libraries"
          $scripts = "$env:MT5_HOME\MQL5\Scripts"

          New-Item -ItemType Directory -Force -Path "$include\Zmq" | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Mql\Lang" | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Katarina\Stage07" | Out-Null
          New-Item -ItemType Directory -Force -Path $libraries | Out-Null
          New-Item -ItemType Directory -Force -Path $scripts | Out-Null

          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Zmq\*.mqh" "$include\Zmq\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Mql\Lang\*.mqh" "$include\Mql\Lang\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libzmq.dll" $libraries -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libsodium.dll" $libraries -Force
          Copy-Item ".\mt5\Include\Katarina\Stage07\*.mqh" "$include\Katarina\Stage07\" -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07HandshakeIntegration.mq5" "$scripts\KatarinaStage07HandshakeIntegration.mq5" -Force

      - name: Strict compile handshake script
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07HandshakeIntegration.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07HandshakeIntegration.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07HandshakeIntegration.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "MetaEditor compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "Stage-07 handshake compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "Stage-07 handshake EX5 missing." }
          if ((Get-Item $artifact).Length -le 0) { throw "Stage-07 handshake EX5 is empty." }

          "STAGE07_HANDSHAKE_EX5_SHA256=$((Get-FileHash $artifact -Algorithm SHA256).Hash)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write Python KAT1 session server
        shell: pwsh
        run: |
          @'
          import asyncio
          import hashlib
          import json
          import os
          import pathlib
          import sys

          ROOT = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "src"))

          from katarina.adapters.transport.kat1_codec import Kat1Codec, SchemaCatalog
          from katarina.adapters.transport.session import (
              HEARTBEAT,
              Kat1SessionSupervisor,
              SessionState,
          )
          from katarina.adapters.transport.zmq import ZmqRouterTransport

          async def main():
              endpoint = os.environ["KAT_HANDSHAKE_ENDPOINT"]
              ready = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-handshake-ready.txt"
              result = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-handshake-python-result.json"

              codec = Kat1Codec(
                  SchemaCatalog.from_path(ROOT / "protocol" / "kat1_message_schemas_v1.json")
              )
              router = ZmqRouterTransport(endpoint=endpoint, send_hwm=64, receive_hwm=64)
              supervisor = Kat1SessionSupervisor(
                  codec=codec,
                  client_instance_id=b"\xAA" * 16,
                  requested_execution_mode=0,
                  heartbeat_interval_ms=1000,
                  stale_after_ms=5000,
              )

              await router.start()
              supervisor.start()
              ready.write_text(endpoint, encoding="utf-8")

              presence = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              hello_send = supervisor.observe(presence, now_ns=1_000_000_000)
              if hello_send is None:
                  raise RuntimeError("presence HEARTBEAT did not produce HELLO")
              if supervisor.state is not SessionState.HELLO_SENT:
                  raise RuntimeError(f"unexpected state after presence: {supervisor.state}")
              await router.send_frame(hello_send.frame, peer=hello_send.peer)

              hello_ack = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              supervisor.observe(hello_ack, now_ns=1_100_000_000)
              if supervisor.state is not SessionState.RECOVERING:
                  raise RuntimeError(f"HELLO_ACK did not enter RECOVERING: {supervisor.state}")
              if supervisor.communication_ready:
                  raise RuntimeError("communication became READY before recovery/reconciliation")
              if supervisor.live_risk_ready:
                  raise RuntimeError("Stage 07 illegally granted live-risk readiness")

              binding = supervisor.binding
              if binding is None:
                  raise RuntimeError("HELLO_ACK did not create binding")
              if binding.stream_id != 77 or binding.boot_id != 88:
                  raise RuntimeError("binding stream/boot mismatch")
              if binding.broker_login != 123456 or binding.broker_server != "Katarina-CI":
                  raise RuntimeError("binding account identity mismatch")

              server = b"Katarina-CI"
              login_ascii = b"123456"
              material = (
                  b"KAT1/account-id/v1"
                  + b"\x00"
                  + len(server).to_bytes(4, "little")
                  + server
                  + b"\x00"
                  + login_ascii
              )
              expected_account_id = hashlib.sha256(material).digest()[:16].hex()
              if binding.account_id != expected_account_id:
                  raise RuntimeError(
                      f"account_id mismatch: expected={expected_account_id} actual={binding.account_id}"
                  )

              python_heartbeat = codec.encode(
                  message_type=HEARTBEAT,
                  schema_version=1,
                  sequence=2,
                  source_time_ns=1_150_000_000,
                  stream_id=77,
                  boot_id=88,
                  values={
                      "uptime_ms": 1150,
                      "latest_produced_sequence": 2,
                      "latest_consumed_command_sequence": 0,
                      "critical_queue_depth": 0,
                      "market_queue_depth": 0,
                      "last_broker_observation_ns": 1_150_000_000,
                      "transport_state": 1,
                  },
              )
              await router.send_frame(python_heartbeat, peer=hello_ack.peer)

              final_ack = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              final_frame = codec.decode(final_ack.frame)
              if final_frame.header.message_type != HEARTBEAT:
                  raise RuntimeError("final MT5 ACK is not HEARTBEAT")
              if final_frame.header.stream_id != 77 or final_frame.header.boot_id != 88:
                  raise RuntimeError("final MT5 ACK binding mismatch")
              supervisor.observe(final_ack, now_ns=1_200_000_000)

              if supervisor.state is not SessionState.RECOVERING:
                  raise RuntimeError("final heartbeat changed RECOVERING state unexpectedly")
              if supervisor.communication_ready or supervisor.live_risk_ready:
                  raise RuntimeError("handshake incorrectly granted readiness/live risk")

              result.write_text(json.dumps({
                  "result": "PASS",
                  "endpoint": endpoint,
                  "state": supervisor.state.value,
                  "communication_ready": supervisor.communication_ready,
                  "live_risk_ready": supervisor.live_risk_ready,
                  "account_id": binding.account_id,
                  "broker_login": binding.broker_login,
                  "broker_server": binding.broker_server,
                  "stream_id": binding.stream_id,
                  "boot_id": binding.boot_id,
              }, indent=2), encoding="utf-8")
              await router.stop()

          asyncio.run(main())
          '@ | Set-Content -Path "$env:RUNNER_TEMP\kat_handshake_server.py" -Encoding UTF8

      - name: Run cross-language KAT1 handshake
        shell: pwsh
        run: |
          $ready = "$env:RUNNER_TEMP\kat-handshake-ready.txt"
          $pythonResult = "$env:RUNNER_TEMP\kat-handshake-python-result.json"
          Remove-Item $ready,$pythonResult -Force -ErrorAction SilentlyContinue

          $server = Start-Process -FilePath "python" -ArgumentList "$env:RUNNER_TEMP\kat_handshake_server.py" -PassThru -NoNewWindow

          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          while ([DateTime]::UtcNow -lt $deadline -and !(Test-Path $ready)) {
            if ($server.HasExited) { throw "Python handshake server exited before ready." }
            Start-Sleep -Milliseconds 100
          }
          if (!(Test-Path $ready)) { throw "Python handshake server did not become ready." }

          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $mt5Evidence = Join-Path $commonFiles "Katarina_Stage07_handshake_result.txt"
          Remove-Item $mt5Evidence -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage07-handshake.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=1
          Enabled=1

          [StartUp]
          Script=KatarinaStage07HandshakeIntegration
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $terminal = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Terminal exit code: $($terminal.ExitCode)"

          $server.WaitForExit(15000) | Out-Null
          if (-not $server.HasExited) {
            Stop-Process -Id $server.Id -Force
            throw "Python handshake server did not terminate."
          }
          if ($server.ExitCode -ne 0) { throw "Python handshake server failed with exit code $($server.ExitCode)." }

          if (!(Test-Path $mt5Evidence)) { throw "MT5 handshake evidence missing." }
          if (!(Test-Path $pythonResult)) { throw "Python handshake evidence missing." }

          $values = @{}
          foreach ($line in Get-Content $mt5Evidence) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $values[$line.Substring(0,$idx)] = $line.Substring($idx+1) }
          }
          $python = Get-Content $pythonResult -Raw | ConvertFrom-Json

          Get-Content $mt5Evidence | Write-Host
          Get-Content $pythonResult | Write-Host

          if ($values["result"] -ne "PASS") { throw "MT5 cross-language handshake did not pass." }
          if ($values["live_risk_ready"] -ne "0") { throw "MT5 evidence incorrectly marks live risk ready." }
          if ($python.result -ne "PASS") { throw "Python handshake result did not pass." }
          if ($python.state -ne "recovering") { throw "Python session must remain RECOVERING." }
          if ($python.communication_ready -ne $false) { throw "Communication must not be READY before recovery." }
          if ($python.live_risk_ready -ne $false) { throw "Stage 07 must never grant live-risk readiness." }

          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          Copy-Item $mt5Evidence ".\build\stage07\Katarina_Stage07_handshake_result.txt" -Force
          Copy-Item $pythonResult ".\build\stage07\stage07_handshake_python_result.json" -Force

      - name: Write handshake evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "07"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner = "windows-2022"
            dependency_repo = "$env:MQL5_ZMQ_REPO"
            dependency_commit = "$env:MQL5_ZMQ_COMMIT"
            endpoint = "$env:KAT_HANDSHAKE_ENDPOINT"
            topology = "PYTHON_ROUTER_MT5_DEALER"
            flow = "HEARTBEAT_TO_HELLO_TO_HELLO_ACK"
            final_state = "RECOVERING"
            communication_ready = $false
            live_risk_ready = $false
            compile = "PASS_0_ERRORS_0_WARNINGS"
            ex5_sha256 = "$env:STAGE07_HANDSHAKE_EX5_SHA256"
            result = "PASS_STAGE07_CROSS_LANGUAGE_HANDSHAKE"
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_handshake_evidence.json" -Encoding UTF8

      - name: Upload handshake evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage07-cross-language-handshake-evidence
          path: |
            build/stage07/KatarinaStage07HandshakeIntegration.compile.log
            build/stage07/Katarina_Stage07_handshake_result.txt
            build/stage07/stage07_handshake_python_result.json
            build/stage07/stage07_handshake_evidence.json
          retention-days: 30

  # from stage07-mql5-codec.yml
  mql5-kat1-codec:
    name: Stage 07 MQL5 KAT1 Codec
    if: inputs.check == 'all' || inputs.check == 'mql5-kat1-codec'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )

          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Include\Katarina\Stage07" | Out-Null
          New-Item -ItemType Directory -Force -Path "$resolved\MQL5\Scripts" | Out-Null

      - name: Stage Stage-07 MQL files
        shell: pwsh
        run: |
          Copy-Item ".\mt5\Include\Katarina\Stage07\*.mqh" "$env:MT5_HOME\MQL5\Include\Katarina\Stage07\" -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07Kat1CodecTest.mq5" "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07Kat1CodecTest.mq5" -Force

      - name: Strict MetaEditor compile
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07Kat1CodecTest.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07Kat1CodecTest.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07Kat1CodecTest.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "MetaEditor compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "Stage-07 MQL5 codec compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "Stage-07 codec EX5 missing." }
          if ((Get-Item $artifact).Length -le 0) { throw "Stage-07 codec EX5 is empty." }

          $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash
          "STAGE07_EX5_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run 13 golden vectors headless
        shell: pwsh
        run: |
          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $evidence = Join-Path $commonFiles "Katarina_Stage07_kat1_codec_result.txt"
          Remove-Item $evidence -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage07-kat1-codec.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Script=KatarinaStage07Kat1CodecTest
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $p = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Terminal exit code: $($p.ExitCode)"

          if (!(Test-Path $evidence)) { throw "Stage-07 MQL5 codec runtime evidence missing." }

          $values = @{}
          foreach ($line in Get-Content $evidence) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $values[$line.Substring(0,$idx)] = $line.Substring($idx+1) }
          }

          if ($values["stage"] -ne "07") { throw "Unexpected Stage-07 evidence stage." }
          if ($values["proof_type"] -ne "MQL5_KAT1_GOLDEN_CONFORMANCE") { throw "Unexpected proof type." }
          if ($values["vectors"] -ne "13") { throw "Expected 13 golden vectors." }
          if ($values["failures"] -ne "0") { throw "MQL5 KAT1 golden-vector failures detected." }
          if ($values["result"] -ne "PASS") { throw "MQL5 KAT1 conformance did not pass." }

          Copy-Item $evidence ".\build\stage07\Katarina_Stage07_kat1_codec_result.txt" -Force

      - name: Write Stage-07 MQL5 codec evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "07"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner = "windows-2022"
            metaeditor = (Get-Item "$env:MT5_HOME\metaeditor64.exe").VersionInfo.FileVersion
            vectors = 13
            compile = "PASS_0_ERRORS_0_WARNINGS"
            runtime = "PASS_MQL5_KAT1_GOLDEN_CONFORMANCE"
            ex5_sha256 = "$env:STAGE07_EX5_SHA256"
            result = "PASS_STAGE07_MQL5_KAT1_CODEC_BASELINE"
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_mql5_kat1_codec_evidence.json" -Encoding UTF8

      - name: Upload Stage-07 MQL5 codec evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage07-mql5-kat1-codec-evidence
          path: |
            build/stage07/KatarinaStage07Kat1CodecTest.compile.log
            build/stage07/Katarina_Stage07_kat1_codec_result.txt
            build/stage07/stage07_mql5_kat1_codec_evidence.json
          retention-days: 30

