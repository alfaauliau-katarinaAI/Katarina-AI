      - name: Strict compile native account record test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07NativeAccountRecordTest.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07NativeAccountRecordTest.ex5"
