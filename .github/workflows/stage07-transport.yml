  # from stage07-preclearance.yml
  preclearance:
    name: Stage 07 Pre-Clearance
    if: inputs.check == 'all' || inputs.check == 'preclearance'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt

      - name: Run 37 Stage 07 regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $log = ".\build\stage07\preclearance_tests.txt"
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          python -m unittest tests.unit.transport.test_stage07_communication tests.unit.transport.test_stage07_stage06_contract -v 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = Get-Content $log -Raw
          if ($text -notmatch "Ran 37 tests" -or $text -notmatch "(?m)^OK\s*$") {
            throw "Expected 37/37 Stage-07 regression tests."
          }

      - name: Run latency and backpressure profile
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python .\scripts\stage07\profile_stage07_transport.py --repo-root . --output .\build\stage07\stage07_transport_profile.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit Stage 07 pre-clearance
        shell: pwsh
        run: |
          python .\scripts\stage07\audit_stage07_preclearance.py --repo-root . --profile-evidence .\build\stage07\stage07_transport_profile.json --test-log .\build\stage07\preclearance_tests.txt --output .\build\stage07\stage07_preclearance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = Get-Content ".\build\stage07\stage07_preclearance.json" -Raw | ConvertFrom-Json
          if ($audit.result -ne "PASS_STAGE07_PRECLEARANCE_MANUAL_TERMINAL_PERMISSION_ONLY") {
            throw "Stage-07 pre-clearance did not pass."
          }

      - name: Upload pre-clearance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage07-preclearance-evidence
          path: |
            build/stage07/preclearance_tests.txt
            build/stage07/stage07_transport_profile.json
            build/stage07/stage07_preclearance.json
          retention-days: 90

  # from stage07-reconnect.yml
  reconnect:
    name: Stage 07 Cross-Process Reconnect
    if: inputs.check == 'all' || inputs.check == 'reconnect'
    env:
      MQL5_ZMQ_REPO: coke5151/mql5-zmq
      MQL5_ZMQ_COMMIT: f332ee903fb8f27cbf28a8169824b8130e2aaab2
      KAT_RECONNECT_ENDPOINT: tcp://127.0.0.1:5571
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout Katarina
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 transport dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07Reconnect"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch pinned MQL5 ZeroMQ binding
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mql5-zmq.zip"
          $extract = "$env:RUNNER_TEMP\mql5-zmq"
          $url = "https://github.com/$env:MQL5_ZMQ_REPO/archive/$env:MQL5_ZMQ_COMMIT.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $root) { throw "Pinned MQL5 ZeroMQ archive extraction failed." }
          "MQL5_ZMQ_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage reconnect integration files
        shell: pwsh
        run: |
          $include = "$env:MT5_HOME\MQL5\Include"
          $libraries = "$env:MT5_HOME\MQL5\Libraries"
          $scripts = "$env:MT5_HOME\MQL5\Scripts"

          New-Item -ItemType Directory -Force -Path $include,$libraries,$scripts | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Zmq" | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Mql\Lang" | Out-Null

          Copy-Item ".\mt5\Include\Katarina" "$include\Katarina" -Recurse -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Zmq\*.mqh" "$include\Zmq\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Mql\Lang\*.mqh" "$include\Mql\Lang\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libzmq.dll" $libraries -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libsodium.dll" $libraries -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07ReconnectIntegration.mq5" "$scripts\KatarinaStage07ReconnectIntegration.mq5" -Force

      - name: Strict compile reconnect integration
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07ReconnectIntegration.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07ReconnectIntegration.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07ReconnectIntegration.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "Reconnect compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "Reconnect integration compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "Reconnect integration EX5 missing." }

          "STAGE07_RECONNECT_EX5_SHA256=$((Get-FileHash $artifact -Algorithm SHA256).Hash)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write persistent Python reconnect peer
        shell: pwsh
        run: |
          @'
          import asyncio
          import json
          import os
          import pathlib
          import sys

          ROOT = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "src"))

          from katarina.adapters.transport.kat1_codec import Kat1Codec, SchemaCatalog
          from katarina.adapters.transport.recovery import Kat1RecoveryGate, RecoveryState
          from katarina.adapters.transport.session import HEARTBEAT, Kat1SessionSupervisor, SessionState
          from katarina.adapters.transport.zmq import ZmqRouterTransport

          async def recovery_cycle(
              *,
              router,
              codec,
              session,
              peer,
              binding,
              phase,
              now_base,
              expected_snapshot_sequence,
              expected_reconcile_sequence,
              expected_ready_sequence,
              expected_mt5_sequences,
          ):
              recovery = Kat1RecoveryGate(
                  codec=codec,
                  stream_id=binding.stream_id,
                  boot_id=binding.boot_id,
                  account_id=binding.account_id,
              )
              recovery.start(snapshot_request_id=bytes([0x40 + phase]) * 16)

              snapshot_seq = session.reserve_outbound_sequence(
                  stream_id=binding.stream_id
              )
              if snapshot_seq != expected_snapshot_sequence:
                  raise RuntimeError(
                      f"phase {phase}: snapshot request seq expected "
                      f"{expected_snapshot_sequence}, got {snapshot_seq}"
                  )
              request = recovery.build_snapshot_request(
                  sequence=snapshot_seq,
                  source_time_ns=now_base + 200_000_000,
                  requested_record_mask=0x7F,
                  after_execution_cursor=0,
                  max_chunk_bytes=60000,
              )
              await router.send_frame(request, peer=peer)

              for index, expected_type in enumerate((11, 12, 13)):
                  received = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
                  decoded = codec.decode(received.frame)
                  expected_seq = expected_mt5_sequences[index]
                  if decoded.header.sequence != expected_seq:
                      raise RuntimeError(
                          f"phase {phase}: MT5 recovery sequence expected "
                          f"{expected_seq}, got {decoded.header.sequence}"
                      )
                  if decoded.header.boot_id != binding.boot_id:
                      raise RuntimeError(f"phase {phase}: recovery boot_id mismatch")
                  session.observe(
                      received,
                      now_ns=now_base + 300_000_000 + index * 100_000_000,
                  )
                  recovery.observe(decoded)

              if recovery.state is not RecoveryState.WAITING_RECONCILE:
                  raise RuntimeError(f"phase {phase}: snapshot incomplete")

              reconcile_seq = session.reserve_outbound_sequence(
                  stream_id=binding.stream_id
              )
              if reconcile_seq != expected_reconcile_sequence:
                  raise RuntimeError(
                      f"phase {phase}: reconcile seq expected "
                      f"{expected_reconcile_sequence}, got {reconcile_seq}"
                  )
              reconcile = recovery.build_reconcile_request(
                  sequence=reconcile_seq,
                  source_time_ns=now_base + 600_000_000,
                  request_id=bytes([0x50 + phase]) * 16,
                  after_event_cursor=expected_mt5_sequences[-1],
                  scope_flags=0xFFFFFFFF,
              )
              await router.send_frame(reconcile, peer=peer)

              report_received = await asyncio.wait_for(
                  router.receive_frame(), timeout=10.0
              )
              report = codec.decode(report_received.frame)
              expected_report_seq = expected_mt5_sequences[-1] + 1
              if report.header.sequence != expected_report_seq:
                  raise RuntimeError(
                      f"phase {phase}: report seq expected "
                      f"{expected_report_seq}, got {report.header.sequence}"
                  )
              session.observe(
                  report_received,
                  now_ns=now_base + 700_000_000,
              )
              recovery.observe(report)
              if recovery.state is not RecoveryState.COMPLETE:
                  raise RuntimeError(f"phase {phase}: reconciliation incomplete")

              session.mark_recovered(now_ns=now_base + 800_000_000)
              if session.state is not SessionState.READY:
                  raise RuntimeError(f"phase {phase}: session did not become READY")

              ready_seq = session.reserve_outbound_sequence(
                  stream_id=binding.stream_id
              )
              if ready_seq != expected_ready_sequence:
                  raise RuntimeError(
                      f"phase {phase}: ready heartbeat seq expected "
                      f"{expected_ready_sequence}, got {ready_seq}"
                  )

              ready_hb = codec.encode(
                  message_type=HEARTBEAT,
                  schema_version=1,
                  sequence=ready_seq,
                  source_time_ns=now_base + 850_000_000,
                  stream_id=binding.stream_id,
                  boot_id=binding.boot_id,
                  values={
                      "uptime_ms": phase * 1000 + 850,
                      "latest_produced_sequence": ready_seq,
                      "latest_consumed_command_sequence": expected_report_seq,
                      "critical_queue_depth": 0,
                      "market_queue_depth": 0,
                      "last_broker_observation_ns": now_base + 850_000_000,
                      "transport_state": 1,
                  },
              )
              await router.send_frame(ready_hb, peer=peer)

              final_received = await asyncio.wait_for(
                  router.receive_frame(), timeout=10.0
              )
              final_frame = codec.decode(final_received.frame)
              expected_final = expected_report_seq + 1
              if final_frame.header.sequence != expected_final:
                  raise RuntimeError(
                      f"phase {phase}: final MT5 seq expected "
                      f"{expected_final}, got {final_frame.header.sequence}"
                  )
              session.observe(
                  final_received,
                  now_ns=now_base + 900_000_000,
              )
              if session.state is not SessionState.READY:
                  raise RuntimeError(f"phase {phase}: final heartbeat lost READY")
              if session.live_risk_ready:
                  raise RuntimeError("Stage 07 illegally granted live-risk readiness")

              return {
                  "snapshot_sequence": snapshot_seq,
                  "reconcile_sequence": reconcile_seq,
                  "ready_sequence": ready_seq,
                  "final_mt5_sequence": final_frame.header.sequence,
                  "boot_id": binding.boot_id,
              }

          async def main():
              endpoint = os.environ["KAT_RECONNECT_ENDPOINT"]
              ready = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-reconnect-ready.txt"
              phase1_done = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-reconnect-phase1-done.txt"
              phase2_ready = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-reconnect-phase2-ready.txt"
              result = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-reconnect-python-result.json"

              codec = Kat1Codec(
                  SchemaCatalog.from_path(ROOT / "protocol" / "kat1_message_schemas_v1.json")
              )
              router = ZmqRouterTransport(endpoint=endpoint, send_hwm=64, receive_hwm=64)
              session = Kat1SessionSupervisor(
                  codec=codec,
                  client_instance_id=b"\xA9" * 16,
                  requested_execution_mode=0,
                  heartbeat_interval_ms=1000,
                  stale_after_ms=5000,
              )

              await router.start()
              session.start()
              ready.write_text(endpoint, encoding="utf-8")

              # Phase 1: boot_id=88, MT5 lane 1..7, Python lane 1..4.
              presence1 = await asyncio.wait_for(router.receive_frame(), timeout=30.0)
              p1 = codec.decode(presence1.frame)
              if p1.header.sequence != 1 or p1.header.boot_id != 88:
                  raise RuntimeError("phase1 presence sequence/boot mismatch")
              hello1 = session.observe(presence1, now_ns=1_000_000_000)
              if hello1 is None:
                  raise RuntimeError("phase1 presence did not produce HELLO")
              if codec.decode(hello1.frame).header.sequence != 1:
                  raise RuntimeError("phase1 Python HELLO sequence is not 1")
              await router.send_frame(hello1.frame, peer=hello1.peer)

              ack1 = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              ack1_frame = codec.decode(ack1.frame)
              if ack1_frame.header.sequence != 2 or ack1_frame.header.boot_id != 88:
                  raise RuntimeError("phase1 HELLO_ACK sequence/boot mismatch")
              session.observe(ack1, now_ns=1_100_000_000)
              binding1 = session.binding
              if binding1 is None or binding1.boot_id != 88:
                  raise RuntimeError("phase1 binding missing")

              phase1 = await recovery_cycle(
                  router=router,
                  codec=codec,
                  session=session,
                  peer=ack1.peer,
                  binding=binding1,
                  phase=1,
                  now_base=1_000_000_000,
                  expected_snapshot_sequence=2,
                  expected_reconcile_sequence=3,
                  expected_ready_sequence=4,
                  expected_mt5_sequences=(3, 4, 5),
              )
              if phase1["final_mt5_sequence"] != 7:
                  raise RuntimeError("phase1 did not finish MT5 sequence 7")

              phase1_done.write_text("phase1 READY", encoding="utf-8")

              # Give the old DEALER process time to close, then force session
              # stale without destroying binding/sequence history.
              await asyncio.sleep(1.0)
              if not session.check_stale(now_ns=8_000_000_000):
                  raise RuntimeError("phase1 session did not become STALE")
              if session.state is not SessionState.STALE:
                  raise RuntimeError("phase1 stale state mismatch")
              phase2_ready.write_text("STALE; launch phase2", encoding="utf-8")

              # Phase 2: same stream, new boot=89. MT5 must continue at 8;
              # Python must continue at 5, not reset to 1.
              presence2 = await asyncio.wait_for(router.receive_frame(), timeout=30.0)
              p2 = codec.decode(presence2.frame)
              if p2.header.sequence != 8 or p2.header.boot_id != 89:
                  raise RuntimeError(
                      f"phase2 presence expected seq8/boot89, "
                      f"got seq{p2.header.sequence}/boot{p2.header.boot_id}"
                  )
              hello2 = session.observe(presence2, now_ns=9_000_000_000)
              if hello2 is None:
                  raise RuntimeError("phase2 stale presence did not produce HELLO")
              hello2_frame = codec.decode(hello2.frame)
              if hello2_frame.header.sequence != 5:
                  raise RuntimeError(
                      f"phase2 Python HELLO expected sequence 5, "
                      f"got {hello2_frame.header.sequence}"
                  )
              await router.send_frame(hello2.frame, peer=hello2.peer)

              ack2 = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              ack2_frame = codec.decode(ack2.frame)
              if ack2_frame.header.sequence != 9 or ack2_frame.header.boot_id != 89:
                  raise RuntimeError("phase2 HELLO_ACK sequence/boot mismatch")
              session.observe(ack2, now_ns=9_100_000_000)

              binding2 = session.binding
              if binding2 is None:
                  raise RuntimeError("phase2 binding missing")
              if binding2.stream_id != binding1.stream_id:
                  raise RuntimeError("phase2 stream_id changed")
              if binding2.boot_id != 89:
                  raise RuntimeError("phase2 new boot_id not accepted")
              if (
                  binding2.account_id != binding1.account_id
                  or binding2.broker_login != binding1.broker_login
                  or binding2.broker_server != binding1.broker_server
              ):
                  raise RuntimeError("phase2 account binding changed")

              phase2 = await recovery_cycle(
                  router=router,
                  codec=codec,
                  session=session,
                  peer=ack2.peer,
                  binding=binding2,
                  phase=2,
                  now_base=9_000_000_000,
                  expected_snapshot_sequence=6,
                  expected_reconcile_sequence=7,
                  expected_ready_sequence=8,
                  expected_mt5_sequences=(10, 11, 12),
              )
              if phase2["final_mt5_sequence"] != 14:
                  raise RuntimeError("phase2 did not finish MT5 sequence 14")

              result.write_text(json.dumps({
                  "result": "PASS",
                  "stream_id_stable": binding1.stream_id == binding2.stream_id == 77,
                  "boot_transition": [binding1.boot_id, binding2.boot_id],
                  "phase1_python_final": phase1["ready_sequence"],
                  "phase2_python_first": 5,
                  "phase2_python_final": phase2["ready_sequence"],
                  "phase1_mt5_final": phase1["final_mt5_sequence"],
                  "phase2_mt5_first": 8,
                  "phase2_mt5_final": phase2["final_mt5_sequence"],
                  "session_state": session.state.value,
                  "communication_ready": session.communication_ready,
                  "live_risk_ready": session.live_risk_ready,
                  "duplicate_or_gap_detected": False,
                  "full_recovery_repeated": True,
              }, indent=2), encoding="utf-8")
              await router.stop()

          asyncio.run(main())
          '@ | Set-Content -Path "$env:RUNNER_TEMP\kat_reconnect_peer.py" -Encoding UTF8

      - name: Run two-terminal-process reconnect proof
        shell: pwsh
        run: |
          $ready = "$env:RUNNER_TEMP\kat-reconnect-ready.txt"
          $phase1Done = "$env:RUNNER_TEMP\kat-reconnect-phase1-done.txt"
          $phase2Ready = "$env:RUNNER_TEMP\kat-reconnect-phase2-ready.txt"
          $pythonResult = "$env:RUNNER_TEMP\kat-reconnect-python-result.json"
          Remove-Item $ready,$phase1Done,$phase2Ready,$pythonResult -Force -ErrorAction SilentlyContinue

          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $marker = Join-Path $commonFiles "Katarina_Stage07_reconnect_phase.txt"
          $mt5Evidence = Join-Path $commonFiles "Katarina_Stage07_reconnect_result.txt"
          Remove-Item $marker,$mt5Evidence -Force -ErrorAction SilentlyContinue

          # Keep the ROUTER process alive in THIS SAME workflow step while both
          # independent MT5 terminal processes start/stop.
          $peer = Start-Process -FilePath "python" -ArgumentList "$env:RUNNER_TEMP\kat_reconnect_peer.py" -PassThru -NoNewWindow

          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            while ([DateTime]::UtcNow -lt $deadline -and !(Test-Path $ready)) {
              if ($peer.HasExited) { throw "Python reconnect peer exited before ready." }
              Start-Sleep -Milliseconds 100
            }
            if (!(Test-Path $ready)) { throw "Python reconnect peer did not become ready." }

            $config1 = Join-Path $env:RUNNER_TEMP "stage07-reconnect-phase1.ini"
            @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=1
          Enabled=1

          [StartUp]
          Script=KatarinaStage07ReconnectIntegration
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config1 -Encoding ASCII

            $p1 = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config1`"") -Wait -PassThru
            Write-Host "Phase-1 terminal exit code: $($p1.ExitCode)"

            if (!(Test-Path $mt5Evidence)) { throw "Phase-1 reconnect evidence missing." }
            $phase1Text = Get-Content $mt5Evidence -Raw
            Write-Host $phase1Text
            if ($phase1Text -notmatch "result=PHASE1_PASS") { throw "Reconnect phase 1 failed." }
            if ($phase1Text -notmatch "last_mt5_sequence=7") { throw "Phase 1 MT5 sequence did not end at 7." }
            if ($phase1Text -notmatch "last_python_sequence=4") { throw "Phase 1 Python sequence did not end at 4." }

            $deadline = [DateTime]::UtcNow.AddSeconds(12)
            while ([DateTime]::UtcNow -lt $deadline -and !(Test-Path $phase2Ready)) {
              if ($peer.HasExited) { throw "Python reconnect peer exited before phase 2." }
              Start-Sleep -Milliseconds 100
            }
            if (!(Test-Path $phase2Ready)) { throw "Python peer never reached STALE/phase2-ready." }
            Get-Content $phase2Ready | Write-Host

            Remove-Item $mt5Evidence -Force -ErrorAction SilentlyContinue

            $config2 = Join-Path $env:RUNNER_TEMP "stage07-reconnect-phase2.ini"
            @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=1
          Enabled=1

          [StartUp]
          Script=KatarinaStage07ReconnectIntegration
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config2 -Encoding ASCII

            $p2 = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config2`"") -Wait -PassThru
            Write-Host "Phase-2 terminal exit code: $($p2.ExitCode)"

            if (!(Test-Path $mt5Evidence)) { throw "Phase-2 reconnect evidence missing." }
            $phase2Text = Get-Content $mt5Evidence -Raw
            Write-Host $phase2Text
            if ($phase2Text -notmatch "result=PASS") { throw "Reconnect phase 2 failed." }
            if ($phase2Text -notmatch "boot_id=89") { throw "Phase 2 did not use new boot_id 89." }
            if ($phase2Text -notmatch "last_mt5_sequence=14") { throw "Phase 2 MT5 sequence did not end at 14." }
            if ($phase2Text -notmatch "last_python_sequence=8") { throw "Phase 2 Python sequence did not end at 8." }

            $peer.WaitForExit(15000) | Out-Null
            if (-not $peer.HasExited) {
              throw "Python reconnect peer did not terminate after phase 2."
            }
            if ($peer.ExitCode -ne 0) {
              throw "Python reconnect peer failed with exit code $($peer.ExitCode)."
            }

            if (!(Test-Path $pythonResult)) { throw "Python reconnect result missing." }
            $python = Get-Content $pythonResult -Raw | ConvertFrom-Json
            Get-Content $pythonResult | Write-Host

            if ($python.result -ne "PASS") { throw "Python reconnect result did not pass." }
            if ($python.stream_id_stable -ne $true) { throw "stream_id changed across reconnect." }
            if ($python.phase1_mt5_final -ne 7 -or $python.phase2_mt5_first -ne 8 -or $python.phase2_mt5_final -ne 14) {
              throw "MT5 sequence continuity failed."
            }
            if ($python.phase1_python_final -ne 4 -or $python.phase2_python_first -ne 5 -or $python.phase2_python_final -ne 8) {
              throw "Python sequence continuity failed."
            }
            if ($python.session_state -ne "ready" -or $python.communication_ready -ne $true) {
              throw "Second recovery did not finish READY."
            }
            if ($python.live_risk_ready -ne $false) { throw "Stage 07 illegally granted live-risk readiness." }
            if ($python.duplicate_or_gap_detected -ne $false) { throw "Duplicate/gap was detected." }
            if ($python.full_recovery_repeated -ne $true) { throw "Full recovery was not repeated." }

            Copy-Item $mt5Evidence ".\build\stage07\Katarina_Stage07_reconnect_result.txt" -Force
            Copy-Item $pythonResult ".\build\stage07\stage07_reconnect_python_result.json" -Force
          }
          finally {
            if (-not $peer.HasExited) {
              Stop-Process -Id $peer.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Write reconnect evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "07"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner = "windows-2022"
            process_restart = $true
            stream_id_stable = $true
            boot_id_changed = $true
            boot_transition = @(88,89)
            mt5_lane = "1..7 then 8..14"
            python_lane = "1..4 then 5..8"
            duplicate_or_gap = $false
            stale_gate = "PASS"
            rehandshake = "PASS"
            repeated_snapshot_reconciliation = "PASS"
            final_state = "READY"
            communication_ready = $true
            live_risk_ready = $false
            compile = "PASS_0_ERRORS_0_WARNINGS"
            ex5_sha256 = "$env:STAGE07_RECONNECT_EX5_SHA256"
            result = "PASS_STAGE07_CROSS_PROCESS_RECONNECT"
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_reconnect_evidence.json" -Encoding UTF8

      - name: Upload reconnect evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: stage07-cross-process-reconnect-evidence
          path: |
            build/stage07/KatarinaStage07ReconnectIntegration.compile.log
            build/stage07/Katarina_Stage07_reconnect_result.txt
            build/stage07/stage07_reconnect_python_result.json
            build/stage07/stage07_reconnect_evidence.json
          retention-days: 30

  # from stage07-recovery-integration.yml
  recovery-integration:
    name: Stage 07 Cross-Language Recovery
    if: inputs.check == 'all' || inputs.check == 'recovery-integration'
    env:
      MQL5_ZMQ_REPO: coke5151/mql5-zmq
      MQL5_ZMQ_COMMIT: f332ee903fb8f27cbf28a8169824b8130e2aaab2
      KAT_RECOVERY_ENDPOINT: tcp://127.0.0.1:5570
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Katarina
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stage 07 transport dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-stage07.txt

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw "MT5 installer download failed." }

      - name: Install MetaTrader 5 unattended
        shell: pwsh
        run: |
          $requested = "C:\MT5Stage07Recovery"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList @("/auto", "/path:`"$requested`"") -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $candidates = @(
            $requested,
            "$env:ProgramFiles\MetaTrader 5",
            "$env:ProgramFiles\MetaTrader 5 Terminal"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and
                (Test-Path "$candidate\metaeditor64.exe") -and
                (Test-Path "$candidate\terminal64.exe")) {
              $resolved = $candidate
              break
            }
          }

          if (-not $resolved) {
            $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $candidate = Split-Path -Parent $found.FullName
              if (Test-Path "$candidate\terminal64.exe") { $resolved = $candidate }
            }
          }

          if (-not $resolved) {
            throw "MetaTrader installation files not found. Installer exit code=$($p.ExitCode)."
          }

          "MT5_HOME=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch pinned MQL5 ZeroMQ binding
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mql5-zmq.zip"
          $extract = "$env:RUNNER_TEMP\mql5-zmq"
          $url = "https://github.com/$env:MQL5_ZMQ_REPO/archive/$env:MQL5_ZMQ_COMMIT.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $root) { throw "Pinned MQL5 ZeroMQ archive extraction failed." }
          "MQL5_ZMQ_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage recovery integration files
        shell: pwsh
        run: |
          $include = "$env:MT5_HOME\MQL5\Include"
          $libraries = "$env:MT5_HOME\MQL5\Libraries"
          $scripts = "$env:MT5_HOME\MQL5\Scripts"

          New-Item -ItemType Directory -Force -Path $include,$libraries,$scripts | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Zmq" | Out-Null
          New-Item -ItemType Directory -Force -Path "$include\Mql\Lang" | Out-Null

          Copy-Item ".\mt5\Include\Katarina" "$include\Katarina" -Recurse -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Zmq\*.mqh" "$include\Zmq\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Include\Mql\Lang\*.mqh" "$include\Mql\Lang\" -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libzmq.dll" $libraries -Force
          Copy-Item "$env:MQL5_ZMQ_ROOT\Library\libsodium.dll" $libraries -Force
          Copy-Item ".\mt5\Tests\KatarinaStage07RecoveryIntegration.mq5" "$scripts\KatarinaStage07RecoveryIntegration.mq5" -Force

      - name: Strict compile recovery integration
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\build\stage07" | Out-Null
          $source = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07RecoveryIntegration.mq5"
          $artifact = "$env:MT5_HOME\MQL5\Scripts\KatarinaStage07RecoveryIntegration.ex5"
          $log = (Resolve-Path ".\build\stage07").Path + "\KatarinaStage07RecoveryIntegration.compile.log"

          Remove-Item $artifact,$log -Force -ErrorAction SilentlyContinue
          $args = @(
            "/compile:`"$source`"",
            "/inc:`"$env:MT5_HOME\MQL5`"",
            "/log:`"$log`""
          )
          Start-Process -FilePath "$env:MT5_HOME\metaeditor64.exe" -ArgumentList $args -Wait | Out-Null

          if (!(Test-Path $log)) { throw "Recovery compile log missing." }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host $text
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "Recovery integration compile is not zero-error/zero-warning."
          }
          if (!(Test-Path $artifact)) { throw "Recovery integration EX5 missing." }

          "STAGE07_RECOVERY_EX5_SHA256=$((Get-FileHash $artifact -Algorithm SHA256).Hash)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write Python recovery peer
        shell: pwsh
        run: |
          @'
          import asyncio
          import json
          import os
          import pathlib
          import sys

          ROOT = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "src"))

          from katarina.adapters.transport.kat1_codec import Kat1Codec, SchemaCatalog
          from katarina.adapters.transport.recovery import Kat1RecoveryGate, RecoveryState
          from katarina.adapters.transport.session import HEARTBEAT, Kat1SessionSupervisor, SessionState
          from katarina.adapters.transport.zmq import ZmqRouterTransport

          async def main():
              endpoint = os.environ["KAT_RECOVERY_ENDPOINT"]
              ready = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-recovery-ready.txt"
              result = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kat-recovery-python-result.json"

              codec = Kat1Codec(
                  SchemaCatalog.from_path(ROOT / "protocol" / "kat1_message_schemas_v1.json")
              )
              router = ZmqRouterTransport(endpoint=endpoint, send_hwm=64, receive_hwm=64)
              session = Kat1SessionSupervisor(
                  codec=codec,
                  client_instance_id=b"\xA8" * 16,
                  requested_execution_mode=0,
                  heartbeat_interval_ms=1000,
                  stale_after_ms=5000,
              )

              await router.start()
              session.start()
              ready.write_text(endpoint, encoding="utf-8")

              presence = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              hello = session.observe(presence, now_ns=1_000_000_000)
              if hello is None:
                  raise RuntimeError("presence did not produce HELLO")
              await router.send_frame(hello.frame, peer=hello.peer)

              ack = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              session.observe(ack, now_ns=1_100_000_000)
              if session.state is not SessionState.RECOVERING:
                  raise RuntimeError("HELLO_ACK did not enter RECOVERING")
              binding = session.binding
              if binding is None:
                  raise RuntimeError("HELLO_ACK binding missing")

              recovery = Kat1RecoveryGate(
                  codec=codec,
                  stream_id=binding.stream_id,
                  boot_id=binding.boot_id,
                  account_id=binding.account_id,
              )
              snapshot_request_id = b"\x44" * 16
              recovery.start(snapshot_request_id=snapshot_request_id)

              snapshot_request_sequence = session.reserve_outbound_sequence(
                  stream_id=binding.stream_id
              )
              if snapshot_request_sequence != 2:
                  raise RuntimeError(
                      f"expected Python snapshot request sequence 2, got {snapshot_request_sequence}"
                  )
              snapshot_request = recovery.build_snapshot_request(
                  sequence=snapshot_request_sequence,
                  source_time_ns=1_200_000_000,
                  requested_record_mask=0x7F,
                  after_execution_cursor=0,
                  max_chunk_bytes=60000,
              )
              await router.send_frame(snapshot_request, peer=ack.peer)

              snapshot_messages = []
              now_ns = 2_000_000_000
              for expected_type in (11, 12, 13):
                  received = await asyncio.wait_for(router.receive_frame(), timeout=10.0)

                  # Session supervisor owns MT5→Python lane continuity even
                  # when message semantics are dispatched to the recovery gate.
                  session.observe(received, now_ns=now_ns)
                  decoded = codec.decode(received.frame)
                  if decoded.header.message_type != expected_type:
                      raise RuntimeError(
                          f"expected recovery type {expected_type}, got {decoded.header.message_type}"
                      )
                  if codec.reencode(decoded) != received.frame:
                      raise RuntimeError(
                          f"MQL5 recovery frame {expected_type} is not Python byte-identical"
                      )
                  recovery.observe(decoded)
                  snapshot_messages.append(decoded)
                  now_ns += 100_000_000

              if recovery.state is not RecoveryState.WAITING_RECONCILE:
                  raise RuntimeError(
                      f"snapshot did not reach WAITING_RECONCILE: {recovery.state}"
                  )

              chunk = snapshot_messages[1]
              records = chunk.values["records"]
              if len(records) != 1:
                  raise RuntimeError("synthetic snapshot did not contain one record")
              record = records[0]
              if record["record_type"] != 3 or record["schema_version"] != 1:
                  raise RuntimeError("snapshot embedded record identity mismatch")
              if record["body"] != b"stage07-synthetic-account-state":
                  raise RuntimeError("snapshot embedded record body mismatch")

              reconcile_request_id = b"\x55" * 16
              reconcile_sequence = session.reserve_outbound_sequence(
                  stream_id=binding.stream_id
              )
              if reconcile_sequence != 3:
                  raise RuntimeError(
                      f"expected Python reconcile sequence 3, got {reconcile_sequence}"
                  )

              reconcile_request = recovery.build_reconcile_request(
                  sequence=reconcile_sequence,
                  source_time_ns=2_300_000_000,
                  request_id=reconcile_request_id,
                  after_event_cursor=5,
                  scope_flags=0xFFFFFFFF,
              )
              await router.send_frame(reconcile_request, peer=ack.peer)

              report_received = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              session.observe(report_received, now_ns=2_400_000_000)
              report = codec.decode(report_received.frame)
              if report.header.message_type != 313:
                  raise RuntimeError("expected RECONCILE_REPORT")
              if codec.reencode(report) != report_received.frame:
                  raise RuntimeError("MQL5 RECONCILE_REPORT is not Python byte-identical")
              recovery.observe(report)

              if recovery.state is not RecoveryState.COMPLETE:
                  raise RuntimeError(f"recovery did not complete: {recovery.state}")
              if not recovery.communication_ready or recovery.live_risk_ready:
                  raise RuntimeError("recovery gate readiness/live-risk semantics invalid")

              session.mark_recovered(now_ns=2_500_000_000)
              if session.state is not SessionState.READY:
                  raise RuntimeError("session did not promote to READY")
              if not session.communication_ready or session.live_risk_ready:
                  raise RuntimeError("session READY/live-risk semantics invalid")

              heartbeat_sequence = session.reserve_outbound_sequence(
                  stream_id=binding.stream_id
              )
              if heartbeat_sequence != 4:
                  raise RuntimeError(
                      f"expected Python READY heartbeat sequence 4, got {heartbeat_sequence}"
                  )
              python_heartbeat = codec.encode(
                  message_type=HEARTBEAT,
                  schema_version=1,
                  sequence=heartbeat_sequence,
                  source_time_ns=2_550_000_000,
                  stream_id=binding.stream_id,
                  boot_id=binding.boot_id,
                  values={
                      "uptime_ms": 2550,
                      "latest_produced_sequence": heartbeat_sequence,
                      "latest_consumed_command_sequence": 6,
                      "critical_queue_depth": 0,
                      "market_queue_depth": 0,
                      "last_broker_observation_ns": 2_550_000_000,
                      "transport_state": 1,
                  },
              )
              await router.send_frame(python_heartbeat, peer=ack.peer)

              final_mt5 = await asyncio.wait_for(router.receive_frame(), timeout=10.0)
              session.observe(final_mt5, now_ns=2_600_000_000)
              final_decoded = codec.decode(final_mt5.frame)
              if final_decoded.header.message_type != HEARTBEAT:
                  raise RuntimeError("final MT5 frame is not HEARTBEAT")
              if final_decoded.header.sequence != 7:
                  raise RuntimeError(
                      f"final MT5 sequence expected 7, got {final_decoded.header.sequence}"
                  )
              if session.state is not SessionState.READY:
                  raise RuntimeError("final heartbeat changed READY state")
              if session.live_risk_ready:
                  raise RuntimeError("Stage 07 illegally granted live-risk readiness")

              result.write_text(json.dumps({
                  "result": "PASS",
                  "snapshot_request_sequence": snapshot_request_sequence,
                  "reconcile_request_sequence": reconcile_sequence,
                  "ready_heartbeat_sequence": heartbeat_sequence,
                  "mt5_final_sequence": final_decoded.header.sequence,
                  "snapshot_state": recovery.state.value,
                  "session_state": session.state.value,
                  "communication_ready": session.communication_ready,
                  "live_risk_ready": session.live_risk_ready,
                  "mql_to_python_byte_equality": True,
                  "python_to_mql_byte_equality": True,
                  "snapshot_record_type": record["record_type"],
                  "snapshot_record_schema": record["schema_version"],
              }, indent=2), encoding="utf-8")
              await router.stop()

          asyncio.run(main())
          '@ | Set-Content -Path "$env:RUNNER_TEMP\kat_recovery_peer.py" -Encoding UTF8

      - name: Run cross-language snapshot reconciliation
        shell: pwsh
        run: |
          $ready = "$env:RUNNER_TEMP\kat-recovery-ready.txt"
          $pythonResult = "$env:RUNNER_TEMP\kat-recovery-python-result.json"
          Remove-Item $ready,$pythonResult -Force -ErrorAction SilentlyContinue

          $peer = Start-Process -FilePath "python" -ArgumentList "$env:RUNNER_TEMP\kat_recovery_peer.py" -PassThru -NoNewWindow

          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          while ([DateTime]::UtcNow -lt $deadline -and !(Test-Path $ready)) {
            if ($peer.HasExited) { throw "Python recovery peer exited before ready." }
            Start-Sleep -Milliseconds 100
          }
          if (!(Test-Path $ready)) { throw "Python recovery peer did not become ready." }

          $commonFiles = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $commonFiles | Out-Null
          $mt5Evidence = Join-Path $commonFiles "Katarina_Stage07_recovery_result.txt"
          Remove-Item $mt5Evidence -Force -ErrorAction SilentlyContinue

          $config = Join-Path $env:RUNNER_TEMP "stage07-recovery.ini"
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=1
          Enabled=1

          [StartUp]
          Script=KatarinaStage07RecoveryIntegration
          Symbol=
          Period=H1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $terminal = Start-Process -FilePath "$env:MT5_HOME\terminal64.exe" -ArgumentList @("/portable", "/config:`"$config`"") -Wait -PassThru
          Write-Host "Terminal exit code: $($terminal.ExitCode)"

          $peer.WaitForExit(15000) | Out-Null
          if (-not $peer.HasExited) {
            Stop-Process -Id $peer.Id -Force
            throw "Python recovery peer did not terminate."
          }
          if ($peer.ExitCode -ne 0) { throw "Python recovery peer failed with exit code $($peer.ExitCode)." }

          if (!(Test-Path $mt5Evidence)) { throw "MT5 recovery evidence missing." }
          if (!(Test-Path $pythonResult)) { throw "Python recovery evidence missing." }

          $values = @{}
          foreach ($line in Get-Content $mt5Evidence) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $values[$line.Substring(0,$idx)] = $line.Substring($idx+1) }
          }
          $python = Get-Content $pythonResult -Raw | ConvertFrom-Json

          Get-Content $mt5Evidence | Write-Host
          Get-Content $pythonResult | Write-Host

          if ($values["result"] -ne "PASS") { throw "MT5 recovery integration did not pass." }
          if ($values["request_byte_equality"] -ne "1") { throw "Python→MQL snapshot request equality failed." }
          if ($values["reconcile_request_byte_equality"] -ne "1") { throw "Python→MQL reconcile equality failed." }
          if ($python.result -ne "PASS") { throw "Python recovery result did not pass." }
          if ($python.session_state -ne "ready") { throw "Session did not end READY." }
          if ($python.communication_ready -ne $true) { throw "Communication readiness missing." }
          if ($python.live_risk_ready -ne $false) { throw "Stage 07 must never grant live-risk readiness." }
          if ($python.mql_to_python_byte_equality -ne $true -or $python.python_to_mql_byte_equality -ne $true) {
            throw "Cross-language byte equality failed."
          }

          Copy-Item $mt5Evidence ".\build\stage07\Katarina_Stage07_recovery_result.txt" -Force
          Copy-Item $pythonResult ".\build\stage07\stage07_recovery_python_result.json" -Force

      - name: Write recovery evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schema_version = "1.0"
            stage = "07"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            git_commit = "$env:GITHUB_SHA"
            runner = "windows-2022"
            topology = "PYTHON_ROUTER_MT5_DEALER"
            flow = "HANDSHAKE_SNAPSHOT_RECONCILE_READY"
            snapshot_semantics = "ADR_0011_PROPOSED"
            sequence_semantics = "ADR_0012_PROPOSED"
            python_to_mql_byte_equality = "PASS"
            mql_to_python_byte_equality = "PASS"
            chunk_crc32c = "PASS"
            aggregate_crc32c = "PASS"
            atomic_snapshot = "PASS"
            clean_reconciliation = "PASS"
            final_state = "READY"
            communication_ready = $true
            live_risk_ready = $false
            compile = "PASS_0_ERRORS_0_WARNINGS"
            ex5_sha256 = "$env:STAGE07_RECOVERY_EX5_SHA256"
            result = "PASS_STAGE07_CROSS_LANGUAGE_RECOVERY"
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content ".\build\stage07\stage07_recovery_evidence.json" -Encoding UTF8

