                      "expiration_time_ns": 1790960400000000000,
                      "change_kind": 1,
                      "side": 1,
                      "entry_type": 2,
                      "origin_class": 1,
                      "normalized_order_state": 2,
                      "time_in_force": 2,
                      "filling_policy": 1,
                      "presence_flags": 0,
                      "order_type_raw": 2,
                      "order_state_raw": 1,
                      "order_reason_raw": 3,
