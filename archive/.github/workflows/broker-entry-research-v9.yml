name: KATARINA V9 Broker Entry Research Safety

# On-demand only: avoid redundant GitHub Actions push/PR fanout.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brokerless-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile standalone research program
        run: python -m py_compile scripts/research/broker_entry_diagnostics_v9.py
      - name: Causal signal and worst-case fill smoke test
        run: python scripts/research/broker_entry_diagnostics_v9.py --self-test
      - name: Read-only contract check
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("scripts/research/broker_entry_diagnostics_v9.py").read_text()
          for forbidden in ("order_send(", "order_check(", "account_info(", "history_deals_get("):
              assert forbidden not in src, forbidden
          assert 'terminal.trade_allowed' in src
          print("BROKER_RESEARCH_NO_ORDER_PATH_PASS")
          PY
