name: KATARINA Strategy Replay (GitHub)

# GitHub-hosted only. No broker API, self-hosted VPS, or auto live trading.
# Research replay is initiated manually to avoid CI storms.
on:
  workflow_dispatch:
    inputs:
      min_trades:
        description: "Minimum in-sample trades for an experimental candidate"
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: katarina-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic numerical test dependency
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Verify replay code and CSV tests
        run: python -m unittest discover -s tests/replay -p 'test_*.py' -v
      - name: Run deterministic 4-market synthetic study
        env:
          MIN_TRADES: ${{ inputs.min_trades || '5' }}
        run: |
          python - <<'PY'
          import os
          v = os.environ["MIN_TRADES"]
          assert v.isdigit() and 1 <= int(v) <= 1000, "Invalid min_trades"
          PY
          python scripts/research/github_replay.py \
            --input tests/fixtures/ohlc/synthetic_regimes.csv \
            --min-trades "$MIN_TRADES" \
            --output build/replay/strategy-replay.json
      - name: Ensure research never enables live trading
        run: |
          python - <<'PY'
          import json
          report=json.load(open("build/replay/strategy-replay.json",encoding="utf-8"))
          assert report["dataset_type"] == "synthetic"
          assert report["live_execution_authorized"] is False
          assert report["research_only"] is True
          assert report["configurations_evaluated"] > 100
          print("PASS_GITHUB_REPLAY_RESEARCH_ONLY",report["counts"])
          PY
      - name: Upload auditable study report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: katarina-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/replay/strategy-replay.json
          if-no-files-found: warn
          retention-days: 14
