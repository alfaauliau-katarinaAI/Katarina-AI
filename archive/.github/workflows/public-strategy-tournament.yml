name: KATARINA Public OHLC Strategy Tournament

# On-demand only: avoid redundant GitHub Actions push/PR fanout.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: katarina-public-tournament-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: major_fx
            symbols: 'EURUSD,GBPUSD,USDJPY,AUDUSD'
          - group: cross_fx
            symbols: 'USDCAD,EURGBP,EURJPY'
          - group: commodities
            symbols: 'XAUUSD,USOIL'
          - group: indices
            symbols: 'US30,NAS100'
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository (no private VPS data)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test model and decoder without network
        run: |
          python -m compileall -q scripts/research/public_market_tournament.py
          python -m compileall -q scripts/research/public_github_sample_tournament.py
          python -m unittest discover -s tests/unit/intelligence -p 'test_public_market_tournament.py' -v
          python -m unittest discover -s tests/unit/intelligence -p 'test_public_github_sample_tournament.py' -v
      - name: Download public M5 reference OHLC and test four strategies with modeled spread
        env:
          KAT_SYMBOLS: ${{ matrix.symbols }}
          KAT_START: ${{ inputs.start || '2026-06-01' }}
          KAT_END: ${{ inputs.end || '2026-09-01' }}
        run: |
          python scripts/research/public_github_sample_tournament.py \
            --symbols "$KAT_SYMBOLS" --start "$KAT_START" \
            --end "$KAT_END" --output artifacts/public_tournament
      - name: Verify genuine data and no live trades
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("artifacts/public_tournament/summary.json").read_text())
          assert report["orders_sent"]==0 and report["production"]=="WAIT" and report["risk_governor_changed"] is False
          assert report["independent_holdout"] is False
          assert report["actual_bid_ask_verified"] is False
          for symbol,entry in report["symbols"].items():
              assert entry["public_sample"]["m5_reference_bars"]>=800, (symbol,"missing_real_public_data")
              assert entry["scanner"]["status"]=="OK", (symbol,"missing_H1_M5")
          print("PUBLIC_DATA_AND_RESEARCH_ONLY_CONTRACT_PASS")
          PY
      - name: Summarize audited public-data pilot
        if: always()
        run: |
          if [ -f artifacts/public_tournament/summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/public_tournament/summary.json").read_text())
          print("# KATARINA OHLC strategy research pilot")
          print("Historical exploratory analysis with modeled spreads (NO true ASK/BID source); no verified profitable strategy.")
          for s,x in r["symbols"].items():
              print(f"- {s}: {x['public_sample']['m5_reference_bars']} public reference M5 bars; "
                    f"{x['scanner'].get('signals',0)} candidates; "
                    f"{x['all_paper_trades']['n']} modeled paper trades.")
          print("No broker/VPS data were written to GitHub.")
          PY
          else
            echo "Public-data test failed before producing valid outputs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload summary and modeled events only, no market raw candles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: katarina-public-ohlc-tournament-${{ github.run_number }}-${{ matrix.group }}
          path: artifacts/public_tournament/
          if-no-files-found: warn
          retention-days: 7

  summarize:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research aggregator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test portfolio-integrity summary
        run: |
          python -m unittest discover -s tests/unit/intelligence -p 'test_public_tournament_summary.py' -v
      - name: Download each group's diagnostic artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          pattern: katarina-public-ohlc-tournament-${{ github.run_number }}-*
          path: artifacts/public_tournament_download
          merge-multiple: false
      - name: Consolidate market coverage and 3-month screen
        run: |
          python scripts/research/summarize_public_tournament.py \
            --input artifacts/public_tournament_download \
            --output artifacts/consolidated_tournament
      - name: Publish study summary (not validation evidence)
        if: always()
        run: |
          if [ -f artifacts/consolidated_tournament/SUMMARY.md ]; then
            cat artifacts/consolidated_tournament/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Research aggregation incomplete; do not treat as profitable trading evidence." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload bounded 11-market research summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: katarina-market-tournament-consolidated-${{ github.run_number }}
          path: artifacts/consolidated_tournament/
          if-no-files-found: warn
          retention-days: 7
